<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>restay.ai | Restay Rental</title>
<meta name="description" content="Ask Restay Rental about daily apartment stays, booking, check-in and rules.">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-text-size-adjust:100%}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
.logo{font-size:20px;font-weight:700;letter-spacing:-.5px}
button{font:inherit;color:inherit;cursor:pointer}
.nb{background:none;border:1px solid #333;border-radius:999px;padding:7px 14px;font-size:14px}
main{flex:1;min-height:0;width:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column}
#log{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px 16px;display:flex;flex-direction:column;gap:18px}
#hero{margin:auto;text-align:center;width:100%;padding-bottom:6vh}
#hero h1{margin:0;font-size:clamp(40px,13vw,64px);font-weight:800;letter-spacing:-2px;line-height:1.05}
#hero p{margin:12px 0 0;color:#999}
#chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px}
.chip{background:none;border:1px solid #333;border-radius:999px;padding:9px 16px;font-size:14px}
.chip:active,.nb:active,.cta:active{background:#fff;color:#000}
.msg{animation:up .2s ease-out;word-wrap:break-word;white-space:pre-line}
@keyframes up{from{opacity:0;transform:translateY(6px)}}
.u{align-self:flex-end;max-width:85%;background:#fff;color:#000;padding:10px 16px;border-radius:20px 20px 4px 20px}
.a{align-self:flex-start;max-width:100%;border-left:2px solid #fff;padding-left:14px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;white-space:normal}
.cta{display:inline-block;border:1px solid #fff;border-radius:999px;padding:7px 14px;font-size:14px;color:#fff;text-decoration:none}
.dots i{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:#fff;animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.2}30%{opacity:1}}
form{display:flex;align-items:center;gap:8px;margin:0 16px 16px;padding:7px 7px 7px 20px;border:1.5px solid #fff;border-radius:999px;background:#000}
input{flex:1;min-width:0;border:0;outline:0;background:none;color:#fff;font:inherit;font-size:16px;padding:8px 0;-webkit-appearance:none;appearance:none}
input::placeholder{color:#777}
.send{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:#000;font-size:20px;line-height:1}
.send:disabled{opacity:.4}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.msg,.dots i{animation:none}}
</style>
</head>
<body>
<header><span class="logo">restay.ai</span><button id="new" class="nb" type="button">+ New chat</button></header>
<main>
  <div id="log" aria-live="polite">
    <div id="hero"><h1>restay.ai</h1><p>Ask anything about staying with Restay Rental.</p><div id="chips"></div></div>
  </div>
  <form id="f" autocomplete="off"><input id="t" type="text" enterkeyhint="send" placeholder="Ask about stays, booking…" aria-label="Your question"><button class="send" type="submit" aria-label="Send">↑</button></form>
</main>

<script>
/* ============================================================
   EDIT THIS BLOCK ONLY. Everything in [BRACKETS] is a placeholder:
   replace it with your real details. Never invent details you
   aren’t sure about; guests will trust what the bot says.
   ============================================================ */
const CONFIG = {
  business: "Restay Rental",
  instagram: "restayrental",      // your Instagram username, no @
  whatsapp: "",                   // optional, e.g. "923001234567" (country code, no + or spaces)
  email: "",                      // optional
  greeting: "Hi! 👋 Welcome to Restay Rental. Ask me about booking an apartment, check-in, prices or the rules.",
  fallback: "I’m not sure about that one. Our team can help you directly:",
  faqs: [
    // q = question shown to guests | chip = show as a start button | k = keywords guests might type | a = the answer
    { q: "Help me find a place to stay", chip: true,
      k: ["find","apartment","apartments","place to stay","stay","available","availability","options","area","areas","location","where"],
      a: "We rent apartments by the day in [CITY / AREAS]. Tell us your dates and how many guests, and message us to confirm what’s free." },
    { q: "How do I book a stay?", chip: true,
      k: ["book","booking","reserve","reservation","how to rent","rent"],
      a: "To book: 1) Message us on Instagram with your dates and number of guests. 2) We confirm availability and the price. 3) You pay [PAYMENT METHOD] to confirm. [EDIT THESE STEPS TO MATCH HOW YOU REALLY TAKE BOOKINGS]" },
    { q: "How do check-in and check-out work?", chip: true,
      k: ["check in","checkin","check-in","check out","checkout","check-out","arrive","arrival","key","keys","early","late","time"],
      a: "Check-in is from [CHECK-IN TIME] and check-out is by [CHECK-OUT TIME]. We send you the address and entry details before you arrive. For early check-in or late check-out, ask us and we’ll confirm if it’s possible." },
    { q: "I have a problem with my stay", chip: true,
      k: ["problem","issue","broken","not working","wifi","water","electricity","power","ac","heater","dirty","clean","help","complaint","lost","locked"],
      a: "Sorry about that! Message us right away on [WHATSAPP / PHONE] or Instagram with a short description and a photo if you can, and we’ll sort it out quickly. For emergencies, contact local emergency services first." },
    { q: "How much is it per day?",
      k: ["price","prices","cost","how much","rate","rates","per day","per night","fee","charges","discount","deposit"],
      a: "Prices depend on the apartment and dates. Starting rates: [PRICE RANGE PER DAY]. [DEPOSIT / EXTRA FEES, IF ANY]. Message us your dates for an exact price." },
    { q: "What are the apartment rules?",
      k: ["rules","rule","policy","smoking","smoke","pets","pet","party","parties","noise","guests","visitors","allowed","couples","family"],
      a: "Our rules: [NO SMOKING / QUIET HOURS / MAX GUESTS / PETS / VISITORS / ID REQUIRED]. [EDIT THIS LIST]" },
    { q: "What is your cancellation policy?",
      k: ["cancel","cancellation","refund","change dates","reschedule","postpone"],
      a: "[YOUR CANCELLATION AND REFUND POLICY, e.g. free cancellation up to X hours before check-in]. For changes, message us as early as possible." },
    { q: "How can I pay?",
      k: ["pay","payment","cash","card","bank","transfer","easypaisa","jazzcash","advance"],
      a: "We accept [PAYMENT METHODS]. [ADVANCE / PAY-ON-ARRIVAL DETAILS]." },
    { q: "What does the apartment include?",
      k: ["amenities","include","included","wifi","kitchen","parking","furnished","bedroom","bathroom","towels","tv","facilities"],
      a: "Our apartments include [WIFI / KITCHEN / TOWELS / PARKING / ETC.]. Details can differ by apartment, so ask us about the one you like." }
  ]
};
/* ===================== END OF EDIT BLOCK ===================== */

var $ = function(id){ return document.getElementById(id); };
var log = $("log"), t = $("t"), hero = $("hero");

function norm(s){ return " " + s.toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim() + " "; }
function match(text){
  var q = norm(text), best = null, top = 0;
  CONFIG.faqs.forEach(function(f){
    var s = 0;
    f.k.forEach(function(k){ if (q.indexOf(norm(k)) > -1) s += k.indexOf(" ") > -1 ? 3 : 2; });
    norm(f.q).split(" ").forEach(function(w){ if (w.length > 3 && q.indexOf(" " + w + " ") > -1) s += 1; });
    if (s > top){ top = s; best = f; }
  });
  return top >= 2 ? best : null;
}
function bubble(who, text){
  var d = document.createElement("div");
  d.className = "msg " + who; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function contacts(parent){
  var links = [];
  if (CONFIG.instagram) links.push(["Message on Instagram", "https://ig.me/m/" + CONFIG.instagram]);
  if (CONFIG.whatsapp) links.push(["WhatsApp", "https://wa.me/" + CONFIG.whatsapp]);
  if (CONFIG.email) links.push(["Email", "mailto:" + CONFIG.email]);
  var w = document.createElement("div"); w.className = "links";
  links.forEach(function(l){
    var a = document.createElement("a"); a.className = "cta"; a.href = l[1]; a.target = "_blank"; a.rel = "noopener"; a.textContent = l[0]; w.appendChild(a);
  });
  parent.appendChild(w);
}
function ask(text){
  text = text.trim(); if (!text) return;
  hero.hidden = true;
  bubble("u", text);
  var b = bubble("a", ""); b.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  setTimeout(function(){
    var greet = /^(hi|hello|hey|salam|assalam|aoa)\b/i.test(text) && text.split(" ").length < 4;
    var hit = greet ? { a: CONFIG.greeting } : match(text);
    b.textContent = hit ? hit.a : CONFIG.fallback;
    if (!hit || /instagram|whatsapp|message us/i.test(hit.a)) contacts(b);
    log.scrollTop = log.scrollHeight;
  }, 450);
}
CONFIG.faqs.filter(function(f){ return f.chip; }).forEach(function(f){
  var c = document.createElement("button"); c.type = "button"; c.className = "chip"; c.textContent = f.q;
  c.onclick = function(){ ask(f.q); }; $("chips").appendChild(c);
});
$("f").addEventListener("submit", function(e){ e.preventDefault(); var v = t.value; t.value = ""; ask(v); });
$("new").onclick = function(){
  Array.prototype.slice.call(log.querySelectorAll(".msg")).forEach(function(m){ m.remove(); });
  hero.hidden = false; t.focus();
};
</script>
</body>
</html>
